{% extends 'base.html' %}{% block body %}<div class="center card"><h1>Passwort {{ 'festlegen' if forced else 'ändern' }}</h1>
{% if forced %}<p class="muted">Bitte vergib vor dem ersten Benutzen ein eigenes Passwort.</p>{% endif %}
<form method="post">{% if not forced %}<p><input type="password" name="old" placeholder="Altes Passwort"></p>{% endif %}
<p><input type="password" name="new" placeholder="Neues Passwort (min. 6 Zeichen)" autofocus></p><p><input type="password" name="new2" placeholder="Wiederholen"></p>
<button class="primary">Speichern</button></form></div>{% endblock %}
