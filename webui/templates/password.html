{% extends 'base.html' %}{% block body %}<div class="center card"><h1>{{ _('Set password') if forced else _('Change password') }}</h1>
{% if forced %}<p class="muted">{{ _('Please choose your own password before first use.') }}</p>{% endif %}
<form method="post">{% if not forced %}<p><input type="password" name="old" placeholder="{{ _('Old password') }}"></p>{% endif %}
<p><input type="password" name="new" placeholder="{{ _('New password (min. 6 characters)') }}" autofocus></p><p><input type="password" name="new2" placeholder="{{ _('Repeat') }}"></p>
<button class="primary">{{ _('Save') }}</button></form></div>{% endblock %}
