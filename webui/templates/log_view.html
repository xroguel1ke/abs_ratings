{% extends 'base.html' %}{% block body %}
<p><a href="{{ url_for('logs') }}">← Logs</a></p><h1>{{ name }}</h1>
<div class="card row"><input type="text" id="flt" placeholder="{{ _('Filter (e.g. WARNING, Rejected, title)') }}" style="max-width:340px">
<label class="small"><input type="checkbox" id="follow" checked> {{ _('follow live') }}</label>
<a class="btn" href="{{ url_for('log_download', kind=kind, name=name) }}">⬇ {{ _('Download') }}</a><span class="muted small">{{ size|size }}{{ (', ' ~ _('showing the last 400 KB')) if size > 400000 }}</span></div>
<pre class="log" id="log"></pre>
<script>
let off=0, all='';
function render(){ const f=document.getElementById('flt').value.toLowerCase(); const el=document.getElementById('log');
 el.textContent = f ? all.split('\n').filter(l=>l.toLowerCase().includes(f)).join('\n') : all; if(document.getElementById('follow').checked) el.scrollTop=el.scrollHeight; }
async function poll(){ const r=await fetch("{{ url_for('api_log', kind=kind, name=name) }}?offset="+off); const j=await r.json();
 if(j.text){ all+=j.text; off=j.offset; render(); } if(document.getElementById('follow').checked) setTimeout(poll,2000); }
document.getElementById('flt').addEventListener('input', render); document.getElementById('follow').addEventListener('change', e=>{ if(e.target.checked) poll(); });
poll();
</script>{% endblock %}
