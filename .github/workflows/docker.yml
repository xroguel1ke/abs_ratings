name: Build container image

on:
  push:
    branches: ["main", "refactor/**"]  # main -> :latest; refactor/<name> -> :<name> (trial images, never :latest)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    # every test that needs no private data (tests/private is git-ignored); the image is only built when they pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Syntax
        run: python -m compileall -q abs_ratings.py abs_series.py abs_undo.py abs_apply.py recorder.py source_state.py source_health.py missing_series.py webui tools
      - name: Tests (one process per file - the web UI tests set their own config folder at import time)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "::group::$f"
            python -m pytest "$f" || { fail=1; echo "::error file=$f::tests failed"; }
            echo "::endgroup::"
          done
          exit $fail

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          IMAGE=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG=latest; else TAG=$(echo "${GITHUB_REF_NAME}" | sed 's#.*/##'); fi
          echo "tags=${IMAGE}:${TAG},${IMAGE}:${TAG}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}@${{ github.sha }}
